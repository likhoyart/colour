    const titleRecord=playlist.length
      ?recordForTitle([playlist[trackIndex].artist,playlist[trackIndex].title].filter(Boolean).join(' – ')||'artist – song')
      :record.texts.find(t=>t.text==='artist – song');
    const titleLine=makeLine(titleRecord,title);
    const playLine=makeLine(record.texts.find(t=>t.text==='play'),playLabel);
    const nextLine=makeLine(record.texts.find(t=>t.text==='next'),nextLabel);
    const arrowLine=makeLine(record.texts.find(t=>t.text==='→'),nextLabel);
    await Promise.all([
      revealArtwork(coverGroup,COVER,token),
      revealArtwork(titleOutline,PLAYER_BOXES.title,token),
      revealArtwork(playOutline,PLAYER_BOXES.play,token),
      revealArtwork(nextOutline,PLAYER_BOXES.next,token)
    ]);
    await Promise.all([
      typeLine(titleLine,900,token),typeLine(playLine,400,token),
      typeLine(nextLine,400,token),typeLine(arrowLine,180,token)
    ]);
    if(playlist.length) {
      audio.setAttribute('src',playlist[trackIndex].src);audio.load();
      updateCover(playlist[trackIndex]);
    }
    await until(began,SETTINGS.screenMs,token);check(token);
    playerView.ready=true;state('player-ready','player');syncPlayerControls();reflectPlayback();
    announcement.textContent=playlist.length?'Music player. Play or next.':'Music player. Audio and cover will be added later.';
  }

  // Optional documented API for adding tracks later without changing navigation.
  // It does not start playback: a real click on play is always required.
  window.ColorSite=Object.freeze({
    version:'4.1.0',setPlaylist,
    getStatus:()=>({phase,tracks:playlist.length,index:trackIndex,
      playing:mediaStarted&&!audio.paused&&!audio.ended,hasCover:!!(playlist[trackIndex]&&playlist[trackIndex].cover)})
  });
  setPlaylist(JSON.parse(document.getElementById('playlist-data').textContent||'[]'));

  // Start immediately: there is intentionally no document.fonts dependency.
  run(intro(++generation));
}());
</script>
