<body>
<div id="stage">
  <canvas id="board" width="804" height="1130" aria-label="Tetris board"></canvas>
  <div id="message" aria-live="polite"><div class="text">game over<span class="cursor">_</span></div></div>

  <button id="left" class="control" type="button" aria-label="Move left">←</button>
  <button id="rotate" class="control" type="button" aria-label="Rotate piece">rotate</button>
  <button id="down" class="control" type="button" aria-label="Accelerate falling">↓</button>
  <button id="right" class="control" type="button" aria-label="Move right">→</button>
</div>

<script>
(() => {
  'use strict';

  const FRAME_W=402, FRAME_H=874;
  const COLS=20, ROWS=28;
  const BOARD_W=402, BOARD_H=565;
  const CELL=BOARD_W/COLS; // 20.1 px in the supplied layout
  const DPR=2;

  const stage=document.getElementById('stage');
  const canvas=document.getElementById('board');
  const ctx=canvas.getContext('2d',{alpha:false});
  const msg=document.getElementById('message');

  const leftBtn=document.getElementById('left');
  const rotateBtn=document.getElementById('rotate');
  const downBtn=document.getElementById('down');
  const rightBtn=document.getElementById('right');

  const GRID='#2b2b2b';
  const WHITE='#ffffff';
  const GHOST='#555555';
  const BLACK='#000000';

  const SHAPES={
    I:[[0,0],[1,0],[2,0],[3,0]],
    O:[[0,0],[1,0],[0,1],[1,1]],
    T:[[0,0],[1,0],[2,0],[1,1]],
    S:[[1,0],[2,0],[0,1],[1,1]],
    Z:[[0,0],[1,0],[1,1],[2,1]],
    J:[[0,0],[0,1],[1,1],[2,1]],
    L:[[2,0],[0,1],[1,1],[2,1]]
  };
  const TYPES=Object.keys(SHAPES);

  let grid, current, bag, lastTime=0, dropAcc=0;
  let gameOver=false, lines=0, level=0;
  let acceleratedThisPiece=false;
  let clearFlash=[];
  let clearFlashUntil=0;

  // Background sign flicker state.
  let signLevel=.045;
  let signTarget=.045;
  let signNextChange=0;
  let signBurstUntil=0;
  let signBurstPhase=0;

  // Landing particles.
  let landingParticles=[];


  // Lightweight synthesized interface SFX — no external audio files.
  let audioCtx=null;

  function ensureAudio(){
    if(!audioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return null;
      audioCtx=new AC();
    }
    if(audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
    return audioCtx;
  }

  function tone(freq=220,duration=.035,volume=.022,type='square',endFreq=null,delay=0){
    const ac=ensureAudio();
    if(!ac)return;
    const t=ac.currentTime+delay;
    const o=ac.createOscillator();
    const g=ac.createGain();
    o.type=type;
    o.frequency.setValueAtTime(freq,t);
    if(endFreq) o.frequency.exponentialRampToValueAtTime(Math.max(1,endFreq),t+duration);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(.0002,volume),t+.004);
    g.gain.exponentialRampToValueAtTime(.0001,t+duration);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t+duration+.01);
  }

  function noiseClick(duration=.035,volume=.012,delay=0){
    const ac=ensureAudio();
    if(!ac)return;
    const len=Math.max(1,(ac.sampleRate*duration)|0);
    const buf=ac.createBuffer(1,len,ac.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<len;i++){
      const env=1-i/len;
      data[i]=(Math.random()*2-1)*env;
    }
    const src=ac.createBufferSource();
    const hp=ac.createBiquadFilter();
    const g=ac.createGain();
    hp.type='highpass';
    hp.frequency.value=900;
    g.gain.value=volume;
    src.buffer=buf;
    src.connect(hp); hp.connect(g); g.connect(ac.destination);
    src.start(ac.currentTime+delay);
  }

  const sfx={
    move(){ tone(185,.022,.012,'square',155); },
    rotate(){ tone(255,.036,.016,'square',360); },
    soft(){ tone(105,.018,.006,'square',90); },
    land(fast=false){
      tone(fast?95:115,fast?.065:.045,fast?.028:.018,'square',fast?58:82);
      noiseClick(fast?.055:.035,fast?.015:.009);
    },
    line(){
      tone(440,.045,.018,'square',560,0);
      tone(590,.045,.017,'square',720,.045);
      tone(760,.060,.016,'square',920,.09);
    },
    gameover(){
      tone(220,.09,.018,'square',175,0);
      tone(165,.11,.017,'square',125,.09);
      tone(110,.18,.016,'square',65,.20);
    }
  };

  function fit(){
    const s=Math.min(innerWidth/FRAME_W,innerHeight/FRAME_H);
    stage.style.transform=`scale(${s})`;
  }
  addEventListener('resize',fit,{passive:true});
  fit();

  function emptyGrid(){
    return Array.from({length:ROWS},()=>Array(COLS).fill(0));
  }

  function shuffledBag(){
    const a=TYPES.slice();
    for(let i=a.length-1;i>0;i--){
      const j=(Math.random()*(i+1))|0;
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }

  function nextType(){
    if(!bag.length) bag=shuffledBag();
    return bag.pop();
  }

  function bounds(cells){
    let minX=99,minY=99,maxX=-99,maxY=-99;
    for(const [x,y] of cells){
      minX=Math.min(minX,x);minY=Math.min(minY,y);
      maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);
    }
    return {minX,minY,maxX,maxY,w:maxX-minX+1,h:maxY-minY+1};
  }

  function spawn(){
    const type=nextType();
    const cells=SHAPES[type].map(p=>p.slice());
    const b=bounds(cells);
    current={
      type,
      cells,
      x:Math.floor((COLS-b.w)/2)-b.minX,
      y:-b.minY
    };
    acceleratedThisPiece=false;
    if(collides(current.x,current.y,current.cells)){
      endGame();
    }
  }

  function collides(px,py,cells){
    for(const [cx,cy] of cells){
      const x=px+cx, y=py+cy;
      if(x<0 || x>=COLS || y>=ROWS) return true;
      if(y>=0 && grid[y][x]) return true;
    }
    return false;
  }

  function rotateCells(cells){
    if(current.type==='O') return cells.map(p=>p.slice());
    const rotated=cells.map(([x,y])=>[-y,x]);
    const b=bounds(rotated);
    return rotated.map(([x,y])=>[x-b.minX,y-b.minY]);
  }

  function rotate(){
    if(gameOver){restart();return}
    const r=rotateCells(current.cells);
    const kicks=[0,-1,1,-2,2];
    for(const k of kicks){
      if(!collides(current.x+k,current.y,r)){
        current.x+=k;
        current.cells=r;
        sfx.rotate();
        return;
      }
    }
  }

  function move(dx){
    if(gameOver){restart();return}
    if(!collides(current.x+dx,current.y,current.cells)){
      current.x+=dx;
      sfx.move();
    }
  }

  function softDrop(accelerated=false){
    if(gameOver){restart();return}
    if(accelerated) acceleratedThisPiece=true;

    if(!collides(current.x,current.y+1,current.cells)){
      current.y++;
      if(accelerated) sfx.soft();
    }else{
      lock(acceleratedThisPiece);
    }
  }

  function hardDrop(){
    if(gameOver){restart();return}
    acceleratedThisPiece=true;
    while(!collides(current.x,current.y+1,current.cells)) current.y++;
    lock(true);
  }

  function ghostY(){
    let y=current.y;
    while(!collides(current.x,y+1,current.cells)) y++;
    return y;
  }

  function lock(accelerated=false){
    const landedCells=[];
    for(const [cx,cy] of current.cells){
      const x=current.x+cx, y=current.y+cy;
      if(y<0){endGame();return}
      grid[y][x]=1;
      landedCells.push([x,y]);
    }

    sfx.land(accelerated);
    if(accelerated) spawnLandingParticles(landedCells);

    clearLines();
    spawn();
  }

  function clearLines(){
    const full=[];
    for(let y=0;y<ROWS;y++){
      if(grid[y].every(Boolean)) full.push(y);
    }
    if(!full.length) return;

    sfx.line();
    clearFlash=full.slice();
    clearFlashUntil=performance.now()+140;

    for(const y of full){
      grid.splice(y,1);
      grid.unshift(Array(COLS).fill(0));
    }
    lines+=full.length;
    level=Math.floor(lines/10);
  }

  function dropInterval(){
    return Math.max(120,650-level*45);
  }

  function endGame(){
    gameOver=true;
    sfx.gameover();
    msg.classList.add('show');
  }

  function restart(){
    grid=emptyGrid();
    bag=[];
    lines=0;
    level=0;
    dropAcc=0;
    gameOver=false;
    msg.classList.remove('show');
    spawn();
  }

  function updateSignFlicker(now){
    if(now>=signNextChange){
      const r=Math.random();

      // Softer and rarer electrical instability.
      if(r<.045){
        signBurstUntil=now+110+Math.random()*210;
        signBurstPhase=Math.random()<.58?-1:1;
      }

      if(now<signBurstUntil){
        if(signBurstPhase<0){
          signTarget=Math.random()<.45 ? .012 : .020+Math.random()*.015;
        }else{
          signTarget=.060+Math.random()*.035;
        }
        signNextChange=now+55+Math.random()*85;
      }else{
        // Normal state: about 2 percentage points dimmer than before.
        const base=.025+Math.random()*.022;
        signTarget=(r<.16) ? base+Math.random()*.020 : base;
        signNextChange=now+140+Math.random()*360;
      }
    }

    // Softer interpolation removes the hard voltage jumps.
    const ease=(now<signBurstUntil)?0.24:0.075;
    signLevel+=(signTarget-signLevel)*ease;
  }

  function signPath(c){
    c.beginPath();
    c.moveTo(191.530853,182.060349);
    c.bezierCurveTo(201.964493,174.864578,212.526154,181.264359,220.495407,191.851059);
    c.bezierCurveTo(235.185699,211.464325,245.635345,239.021606,255.540894,263.410828);
    c.bezierCurveTo(263.558167,283.708618,269.799133,302.143829,274.039795,318.811920);
    c.bezierCurveTo(275.832062,326.071381,278.520508,336.626251,279.976746,346.098572);
    c.bezierCurveTo(281.432953,355.698242,281.656982,364.231262,278.488464,370.440002);
    c.bezierCurveTo(274.471863,377.094513,267.766815,373.082703,263.526154,369.214203);
    c.bezierCurveTo(256.885101,364.390503,247.443634,348.406921,237.057999,331.197571);
    c.bezierCurveTo(226.704376,314.242920,215.422607,296.062439,205.805099,292.942139);
    c.bezierCurveTo(193.035095,288.771149,184.345734,301.873169,175.544357,314.720520);
    c.bezierCurveTo(163.766510,332.725891,150.676453,357.560852,140.146805,367.733643);
    c.bezierCurveTo(136.290207,371.602173,132.849655,373.623962,130.049225,373.942383);
    c.bezierCurveTo(120.223679,373.687653,119.951637,360.315002,122.063972,346.066711);
    c.bezierCurveTo(123.168144,338.759491,124.976425,330.783661,126.784714,323.349060);
    c.bezierCurveTo(128.593002,316.010010,130.401276,309.228149,131.313416,306.537720);
    c.bezierCurveTo(135.874130,290.840729,142.371155,273.328888,149.908340,254.623047);
    c.bezierCurveTo(160.470001,229.676636,173.432022,195.114624,191.482849,182.076263);
    c.bezierCurveTo(191.498856,182.076263,191.530853,182.044418,191.546860,182.028503);
    c.lineTo(191.530853,182.060349);
    c.closePath();
  }

  function drawSign(now){
    updateSignFlicker(now);

    ctx.save();
    ctx.scale(DPR,DPR);

    // Wide, barely visible halo behind the sign.
    ctx.save();
    signPath(ctx);
    ctx.fillStyle=`rgba(255,255,255,${Math.max(.004,signLevel*.18)})`;
    ctx.shadowColor=`rgba(255,255,255,${Math.min(.075,signLevel*.48)})`;
    ctx.shadowBlur=11+signLevel*38;
    ctx.fill();
    ctx.restore();

    // Main translucent body. PDF source itself is ~10% white.
    signPath(ctx);
    ctx.fillStyle=`rgba(255,255,255,${Math.max(.004,signLevel)})`;
    ctx.fill();

    // A very subtle inner electrical core on voltage peaks.
    if(signLevel>.065){
      signPath(ctx);
      ctx.fillStyle=`rgba(255,255,255,${(signLevel-.065)*.14})`;
      ctx.shadowColor='rgba(255,255,255,.065)';
      ctx.shadowBlur=4;
      ctx.fill();
    }

    ctx.restore();
  }

  function drawGrid(now){
    ctx.fillStyle=BLACK;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Figure is physically behind the grid, exactly as in the supplied PDF.
    drawSign(now);

    ctx.save();
    ctx.scale(DPR,DPR);

    ctx.strokeStyle=GRID;
    ctx.lineWidth=1;

    // Exact 20 × 28 grid.
    for(let x=0;x<=COLS;x++){
      const px=x*CELL;
      ctx.beginPath();
      ctx.moveTo(px,0);
      ctx.lineTo(px,BOARD_H);
      ctx.stroke();
    }
    for(let y=0;y<=ROWS;y++){
      const py=y*(BOARD_H/ROWS);
      ctx.beginPath();
      ctx.moveTo(0,py);
      ctx.lineTo(BOARD_W,py);
      ctx.stroke();
    }

    // White lower boundary as in the reference.
    ctx.strokeStyle=WHITE;
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(0,BOARD_H-0.5);
    ctx.lineTo(BOARD_W,BOARD_H-0.5);
    ctx.stroke();

    ctx.restore();
  }

  function cellRect(x,y,pad=1.25){
    const cellH=BOARD_H/ROWS;
    return {
      x:x*CELL+pad,
      y:y*cellH+pad,
      w:CELL-pad*2,
      h:cellH-pad*2
    };
  }

  function drawCell(x,y,fill,alpha=1){
    if(y<0)return;
    const r=cellRect(x,y);
    ctx.save();
    ctx.scale(DPR,DPR);
    ctx.globalAlpha=alpha;
    ctx.fillStyle=fill;
    ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.restore();
  }

  function drawLocked(){
    const now=performance.now();
    const flashing=now<clearFlashUntil;
    for(let y=0;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        if(grid[y][x]) drawCell(x,y,WHITE,1);
      }
    }
    if(flashing){
      for(const y of clearFlash){
        for(let x=0;x<COLS;x++) drawCell(x,y,WHITE,.35);
      }
    }
  }

  function drawGhost(){
    if(gameOver || !current) return;
    const gy=ghostY();
    for(const [cx,cy] of current.cells){
      const x=current.x+cx, y=gy+cy;
      if(y<0) continue;
      const r=cellRect(x,y,3);
      ctx.save();
      ctx.scale(DPR,DPR);
      ctx.strokeStyle=GHOST;
      ctx.lineWidth=1;
      ctx.strokeRect(r.x+.5,r.y+.5,r.w-1,r.h-1);
      ctx.restore();
    }
  }

  function drawCurrent(){
    if(gameOver || !current) return;
    for(const [cx,cy] of current.cells){
      drawCell(current.x+cx,current.y+cy,WHITE,1);
    }
  }


  function spawnLandingParticles(cells){
    const cellH=BOARD_H/ROWS;

    // Build one visible impact burst for the whole landing footprint.
    let minX=999,maxX=-999,maxY=-999;
    for(const [gx,gy] of cells){
      minX=Math.min(minX,gx*CELL);
      maxX=Math.max(maxX,(gx+1)*CELL);
      maxY=Math.max(maxY,(gy+1)*cellH);
    }

    const impactX=(minX+maxX)/2;
    const impactY=maxY-2;

    // Central burst: brighter and easier to read.
    const centralCount=18;
    for(let i=0;i<centralCount;i++){
      const a=(Math.random()*Math.PI*.72)+Math.PI*1.14; // mostly sideways/up
      const speed=34+Math.random()*86;
      landingParticles.push({
        x:impactX+(Math.random()-.5)*Math.max(10,(maxX-minX)*.55),
        y:impactY+(Math.random()-.5)*4,
        vx:Math.cos(a)*speed,
        vy:Math.sin(a)*speed*.65,
        gravity:78+Math.random()*52,
        size:1.6+Math.random()*2.8,
        life:.52+Math.random()*.42,
        age:0,
        phase:Math.random()*Math.PI*2,
        flicker:6+Math.random()*12
      });
    }

    // Small local sparks from each individual block edge.
    for(const [gx,gy] of cells){
      const cx=gx*CELL+CELL*.5;
      const cy=(gy+1)*cellH-2;
      const count=5+((Math.random()*4)|0);

      for(let i=0;i<count;i++){
        const dir=Math.random()<.5?-1:1;
        landingParticles.push({
          x:cx+(Math.random()-.5)*CELL*.75,
          y:cy+(Math.random()-.5)*4,
          vx:dir*(28+Math.random()*72),
          vy:-(18+Math.random()*54),
          gravity:74+Math.random()*52,
          size:1.4+Math.random()*2.5,
          life:.46+Math.random()*.38,
          age:0,
          phase:Math.random()*Math.PI*2,
          flicker:7+Math.random()*11
        });
      }
    }

    if(landingParticles.length>180){
      landingParticles.splice(0,landingParticles.length-180);
    }
  }

  function updateLandingParticles(dt){
    const seconds=dt/1000;
    for(let i=landingParticles.length-1;i>=0;i--){
      const p=landingParticles[i];
      p.age+=seconds;
      if(p.age>=p.life){
        landingParticles.splice(i,1);
        continue;
      }
      p.vy+=p.gravity*seconds;
      p.x+=p.vx*seconds;
      p.y+=p.vy*seconds;
      p.vx*=Math.pow(.89,seconds*60);
    }
  }

  function drawLandingParticles(now){
    if(!landingParticles.length)return;

    ctx.save();
    ctx.scale(DPR,DPR);
    ctx.globalCompositeOperation='screen';

    for(const p of landingParticles){
      const k=1-p.age/p.life;
      const flick=.58+.42*Math.sin(now*.001*p.flicker+p.phase);
      const alpha=Math.max(0,k*k*flick);

      ctx.fillStyle=`rgba(255,255,255,${alpha})`;
      ctx.shadowColor=`rgba(255,255,255,${Math.min(1,alpha*.9)})`;
      ctx.shadowBlur=4+p.size*2.4;

      const s=Math.max(1,Math.round(p.size));
      ctx.fillRect(
        Math.round(p.x-p.size*.5),
        Math.round(p.y-p.size*.5),
        s,
        s
      );

      // Tiny horizontal/diagonal streak gives the impact more speed.
      if(alpha>.18){
        ctx.strokeStyle=`rgba(255,255,255,${alpha*.48})`;
        ctx.lineWidth=Math.max(.6,p.size*.42);
        ctx.beginPath();
        ctx.moveTo(p.x,p.y);
        ctx.lineTo(p.x-p.vx*.028,p.y-p.vy*.028);
        ctx.stroke();
      }
    }

    ctx.restore();
    ctx.globalCompositeOperation='source-over';
  }

  function render(now){
    drawGrid(now);
    drawLocked();
    drawGhost();
    drawCurrent();
    drawLandingParticles(now);
  }

  function frame(now){
    if(!lastTime) lastTime=now;
    const dt=Math.min(50,now-lastTime);
    lastTime=now;

    if(!gameOver){
      dropAcc+=dt;
      if(dropAcc>=dropInterval()){
        dropAcc=0;
        softDrop(false);
      }
    }

    updateLandingParticles(dt);
    render(now);
    requestAnimationFrame(frame);
  }

  function pulse(btn){
    btn.classList.add('is-active');
    setTimeout(()=>btn.classList.remove('is-active'),80);
  }

  function repeatButton(btn,action,repeatMs=85,delayMs=260){
    let timer=null, repeater=null;

    const start=e=>{
      e.preventDefault();
      if(btn.setPointerCapture)btn.setPointerCapture(e.pointerId);
      action();
      pulse(btn);
      timer=setTimeout(()=>{
        repeater=setInterval(()=>{
          action();
          pulse(btn);
        },repeatMs);
      },delayMs);
    };

    const stop=()=>{
      clearTimeout(timer);
      clearInterval(repeater);
      timer=repeater=null;
    };

    btn.addEventListener('pointerdown',start);
    btn.addEventListener('pointerup',stop);
    btn.addEventListener('pointercancel',stop);
    btn.addEventListener('lostpointercapture',stop);
  }

  stage.addEventListener('pointerdown',()=>ensureAudio(),{once:true});
  addEventListener('keydown',()=>ensureAudio(),{once:true});

  repeatButton(leftBtn,()=>move(-1));
  repeatButton(rightBtn,()=>move(1));
  // ↓ is soft/accelerated fall: it never hard-drops the piece.
  repeatButton(downBtn,()=>softDrop(true),46,110);

  rotateBtn.addEventListener('pointerdown',e=>{
    e.preventDefault();
    rotate();
    pulse(rotateBtn);
  });

  addEventListener('keydown',e=>{
    const active=document.activeElement;
    if(active && active.tagName==='BUTTON') active.blur();

    if(e.key==='ArrowLeft'){
      e.preventDefault(); move(-1); pulse(leftBtn);
    }else if(e.key==='ArrowRight'){
      e.preventDefault(); move(1); pulse(rightBtn);
    }else if(e.key==='ArrowUp' || e.key==='x' || e.key==='X'){
      e.preventDefault(); rotate(); pulse(rotateBtn);
    }else if(e.key==='ArrowDown'){
      e.preventDefault(); softDrop(true); pulse(downBtn);
    }else if(e.code==='Space'){
      e.preventDefault(); hardDrop();
    }else if(e.key==='r' || e.key==='R'){
      restart();
    }
  },{passive:false});

  // Tap on the grid = rotate. Swipe down remains an optional hard drop gesture.
  let pStart=null;
  canvas.addEventListener('pointerdown',e=>{
    pStart={x:e.clientX,y:e.clientY,t:performance.now()};
    if(canvas.setPointerCapture)canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointerup',e=>{
    if(!pStart)return;
    const dx=e.clientX-pStart.x,dy=e.clientY-pStart.y;
    const adx=Math.abs(dx),ady=Math.abs(dy);
    if(ady>35 && ady>adx) hardDrop();
    else if(adx<14 && ady<14) rotate();
    pStart=null;
  });

  restart();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
